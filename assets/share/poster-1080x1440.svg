<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440" role="img" aria-label="予时妍 YUÉ ATELIER · 为重要时刻，留一份美">
  <title>予时妍 · 竖版海报 1080×1440（小红书 / 朋友圈长图）</title>
  <desc>3:4 竖版，主标放大到 168px 以保证信息流缩略下仍可读。内容全部收在 y 284–1170 区间，上下留白均等；即使被微信裁成 1:1（裁掉上下各 180）也不丢信息。</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400&amp;family=Bodoni+Moda:wght@400;500&amp;display=swap');
    .cn{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif}
    .lat{font-family:"Bodoni Moda","Didot","Georgia",serif}
  </style>

  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FCFAF9"/>
      <stop offset="0.55" stop-color="#F8F4F1"/>
      <stop offset="1" stop-color="#F3EDEA"/>
    </linearGradient>
    <radialGradient id="softp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E9CBCF" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#E9CBCF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#E9CBCF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="envAp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D8B7A8" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#D8B7A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="envBp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C2B6C4" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#C2B6C4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hairp" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="46" stroke="#221D19" stroke-width="1" opacity="0.055"/>
    </pattern>
    <filter id="grainp" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <clipPath id="framep"><rect width="1080" height="1440"/></clipPath>
  </defs>

  <g clip-path="url(#framep)">
    <rect width="1080" height="1440" fill="url(#bgp)"/>
    <ellipse cx="540" cy="660" rx="500" ry="560" fill="url(#softp)"/>
    <ellipse cx="1000" cy="1400" rx="500" ry="460" fill="url(#envAp)"/>
    <ellipse cx="80" cy="40" rx="440" ry="420" fill="url(#envBp)"/>
    <rect width="1080" height="1440" fill="url(#hairp)" opacity="0.28"/>
    <rect width="1080" height="1440" filter="url(#grainp)" opacity="0.05" style="mix-blend-mode:multiply"/>

    <g stroke="#BFA46F" stroke-width="1.2" fill="none" opacity="0.64" stroke-linecap="square">
      <path d="M52 86 V52 H86"/>
      <path d="M994 52 H1028 V86"/>
      <path d="M1028 1354 V1388 H994"/>
      <path d="M86 1388 H52 V1354"/>
    </g>

    <g transform="translate(474,284) scale(2.0625)">
      <circle cx="32" cy="32" r="22.5" fill="none" stroke="#9E4E55" stroke-width="1.6" stroke-linecap="round"
              stroke-dasharray="121.4 20" transform="rotate(155.5 32 32)"/>
      <circle cx="32" cy="32" r="5.6" fill="#9E4E55"/>
    </g>

    <text class="cn" x="551.76" y="676" font-size="168" font-weight="300" letter-spacing="0.14em"
          fill="#221D19" text-anchor="middle">
      <tspan>予</tspan><tspan>时</tspan><tspan fill="#9E4E55">妍</tspan>
    </text>

    <line x1="340" y1="766" x2="740" y2="766" stroke="#BFA46F" stroke-width="1.1" opacity="0.6"/>

    <text class="lat" x="546.9" y="822" font-size="30" letter-spacing="0.46em" fill="#6C635C"
          text-anchor="middle">YUÉ ATELIER</text>

    <text class="cn" x="544.4" y="956" font-size="34" font-weight="300" letter-spacing="0.26em"
          fill="#6C635C" text-anchor="middle">为重要时刻，留一份美</text>

    <line x1="504" y1="1080" x2="576" y2="1080" stroke="#BFA46F" stroke-width="1" opacity="0.5"/>

    <text class="cn" x="542.3" y="1126" font-size="21" font-weight="300" letter-spacing="0.22em"
          fill="#8C8279" text-anchor="middle">甜茉 · 化妆师个人作品集</text>
    <text class="lat" x="542.08" y="1160" font-size="13" letter-spacing="0.32em" fill="#A79C93"
          text-anchor="middle" opacity="0.92">TIANMO · MAKEUP ARTIST</text>

    <g transform="translate(908,1024) scale(0.72)">
      <rect x="3" y="3" width="70" height="166" rx="3" fill="none" stroke="#9E4E55" stroke-width="2.8"/>
      <rect x="9.5" y="9.5" width="57" height="153" rx="1.5" fill="none" stroke="#9E4E55"
            stroke-width="0.9" opacity="0.42"/>
      <text class="cn" fill="#9E4E55" text-anchor="middle" font-weight="400">
        <tspan x="38" y="60" font-size="36">予</tspan>
        <tspan x="38" y="104" font-size="36">時</tspan>
        <tspan x="38" y="148" font-size="36">妍</tspan>
      </text>
    </g>
  </g>
</svg>
