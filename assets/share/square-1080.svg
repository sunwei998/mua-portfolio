<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="予时妍 YUÉ ATELIER · 为重要时刻，留一份美">
  <title>予时妍 · 方版分享图 1080×1080</title>
  <desc>用于微信发送给朋友 / 群卡片的方形缩略、朋友圈方图。与横版同构，比例重排，署名为中英双行，右下加朱文小印。</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400&amp;family=Bodoni+Moda:wght@400;500&amp;display=swap');
    .cn{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif}
    .lat{font-family:"Bodoni Moda","Didot","Georgia",serif}
  </style>

  <defs>
    <linearGradient id="bgs" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FCFAF9"/>
      <stop offset="0.55" stop-color="#F8F4F1"/>
      <stop offset="1" stop-color="#F4EEEB"/>
    </linearGradient>
    <radialGradient id="softs" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E9CBCF" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#E9CBCF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#E9CBCF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="envAs" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D8B7A8" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#D8B7A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="envBs" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C2B6C4" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#C2B6C4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hairs" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="46" stroke="#221D19" stroke-width="1" opacity="0.055"/>
    </pattern>
    <filter id="grains" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <clipPath id="frames"><rect width="1080" height="1080"/></clipPath>
  </defs>

  <g clip-path="url(#frames)">
    <rect width="1080" height="1080" fill="url(#bgs)"/>
    <ellipse cx="540" cy="480" rx="470" ry="430" fill="url(#softs)"/>
    <ellipse cx="990" cy="1060" rx="480" ry="440" fill="url(#envAs)"/>
    <ellipse cx="90" cy="20" rx="430" ry="400" fill="url(#envBs)"/>
    <rect width="1080" height="1080" fill="url(#hairs)" opacity="0.28"/>
    <rect width="1080" height="1080" filter="url(#grains)" opacity="0.05" style="mix-blend-mode:multiply"/>

    <g stroke="#BFA46F" stroke-width="1.15" fill="none" opacity="0.62" stroke-linecap="square">
      <path d="M48 78 V48 H78"/>
      <path d="M1002 48 H1032 V78"/>
      <path d="M1032 1002 V1032 H1002"/>
      <path d="M78 1032 H48 V1002"/>
    </g>

    <g transform="translate(486,168) scale(1.6875)">
      <circle cx="32" cy="32" r="22.5" fill="none" stroke="#9E4E55" stroke-width="1.8" stroke-linecap="round"
              stroke-dasharray="121.4 20" transform="rotate(155.5 32 32)"/>
      <circle cx="32" cy="32" r="5.6" fill="#9E4E55"/>
    </g>

    <text class="cn" x="547.4" y="404" font-size="92" font-weight="300" letter-spacing="0.16em"
          fill="#221D19" text-anchor="middle">
      <tspan>予</tspan><tspan>时</tspan><tspan fill="#9E4E55">妍</tspan>
    </text>

    <line x1="440" y1="458" x2="640" y2="458" stroke="#BFA46F" stroke-width="1" opacity="0.6"/>

    <text class="lat" x="544.2" y="492" font-size="19" letter-spacing="0.44em" fill="#6C635C"
          text-anchor="middle">YUÉ ATELIER</text>

    <text class="cn" x="542.4" y="570" font-size="20" font-weight="300" letter-spacing="0.24em"
          fill="#6C635C" text-anchor="middle">为重要时刻，留一份美</text>

    <line x1="512" y1="700" x2="568" y2="700" stroke="#BFA46F" stroke-width="1" opacity="0.5"/>

    <text class="cn" x="541.6" y="738" font-size="16" font-weight="300" letter-spacing="0.2em"
          fill="#8C8279" text-anchor="middle">甜茉 · 化妆师个人作品集</text>
    <text class="lat" x="541.575" y="768" font-size="10.5" letter-spacing="0.3em" fill="#A79C93"
          text-anchor="middle" opacity="0.92">TIANMO · MAKEUP ARTIST</text>

    <!-- 朱文小印 · 予時妍 -->
    <g transform="translate(920,780) scale(0.62)">
      <rect x="3" y="3" width="70" height="166" rx="3" fill="none" stroke="#9E4E55" stroke-width="3"/>
      <rect x="9.5" y="9.5" width="57" height="153" rx="1.5" fill="none" stroke="#9E4E55"
            stroke-width="0.9" opacity="0.42"/>
      <text class="cn" fill="#9E4E55" text-anchor="middle" font-weight="400">
        <tspan x="38" y="60" font-size="36">予</tspan>
        <tspan x="38" y="104" font-size="36">時</tspan>
        <tspan x="38" y="148" font-size="36">妍</tspan>
      </text>
    </g>
  </g>
</svg>
