<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="予时妍 品牌符号 · 开口环与光点">
  <title>予时妍 · 品牌符号 Symbol</title>
  <desc>开口环（给予 · 未合拢）+ 中心光点（妍 · 点妆）。纯路径绘制，不依赖字体，可放大到任意尺寸。</desc>
  <!-- 开口环：圆周 2πr = 141.37；dasharray 118 + 23.4 留出缺口，rotate(-130) 把缺口放在左下 -->
  <circle cx="32" cy="32" r="22.5" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-dasharray="121.4 20" transform="rotate(155.5 32 32)"/>
  <!-- 中心光点 -->
  <circle cx="32" cy="32" r="5.1" fill="currentColor"/>
</svg>
