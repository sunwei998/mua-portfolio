<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 172" width="76" height="172" role="img" aria-label="予時妍 朱文印章">
  <title>予时妍 · 朱文印章 Seal（偏繁体）</title>
  <desc>金石惯例用繁体「予時妍」，细边朱文，竖排三字。单色朱砂，不描金、不加投影。</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400&amp;display=swap');
    .seal{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;font-weight:400}
  </style>

  <rect x="3" y="3" width="70" height="166" rx="3" fill="none" stroke="#9E4E55" stroke-width="2"/>
  <rect x="9.5" y="9.5" width="57" height="153" rx="1.5" fill="none" stroke="#9E4E55"
        stroke-width="0.6" opacity="0.38"/>

  <text class="seal" fill="#9E4E55" text-anchor="middle">
    <tspan x="38" y="60" font-size="36">予</tspan>
    <tspan x="38" y="104" font-size="36">時</tspan>
    <tspan x="38" y="148" font-size="36">妍</tspan>
  </text>
</svg>
