# ============================================================================
# 予时妍 YUÉ ATELIER · 站点 Nginx 站点配置
#
# 装到服务器：sudo cp /opt/mua/deploy/nginx.conf /etc/nginx/conf.d/mua.conf
# 生效前必做：sudo nginx -t   （语法不过就 reload，会把现有站点全搞挂）
#
# 与 sanhe 的隔离（同机共存）：
#   sanhe 的 Nginx **在容器内**（sanhe-web），本文件是**宿主机**的 Nginx。
#   宿主机只听 8083，完全不碰 80 ⇒ 不惊动 sanhe-web。
#   备案 + 证书到位后：加一个 listen 443 ssl server 块即可，业务配置原样复用。
# ============================================================================

server {
    # 8083 是本项目对外入口（80 被 sanhe-web 占）。
    # 备案后加 443：复制本块并改 listen、加 ssl_certificate 两行。
    listen      8083;
    server_name _;

    # 站点静态根（零构建 ESM 前台）
    root  /opt/mua/site;
    index index.html;

    charset utf-8;
    # 后台上传视频可达 40MB+，转码前的原件更大（曾有 67MB 的 .mov）
    client_max_body_size 200m;

    # 上传大文件时先缓冲到磁盘，避免占满内存（1.7GB 机器的关键）
    client_body_buffer_size 1m;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
    # 视频/图片本身已压缩，再 gzip 纯浪费 CPU
    gzip_vary         on;

    # ---------------------------------------------------------------- API
    # ⚠️ 必须用 `^~`（而不是裸前缀 location）：
    #    Nginx 里「前缀 location」命中后**仍会继续检查正则 location**，
    #    后面那条静态资源正则 `\.js$` 会抢走 /api/xxx.js 这类请求。
    #    `^~` 表示「命中即终止正则匹配」。这是 sanhe 部署手册里记过的坑。
    location ^~ /api/ {
        # 结尾**不带**斜杠：原始路径原样透传给后端
        proxy_pass         http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 后端 trustProxy: true，会读 X-Forwarded-For 拿真实客户端 IP
        proxy_read_timeout 300s;
        # 视频上传 + 服务端转码可能跑几分钟，给足写超时
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # --------------------------------------------------------- 后台（Vue 构建产物）
    # Vite base=/admin/，产物在 admin/dist，部署时 rsync 到 /opt/mua/admin
    location /admin/ {
        alias /opt/mua/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---------------------------------------------------- 上传素材（uploads）
    # 后台上传的图片/视频由 API 写入 /app/data/uploads，容器起服务时
    # 宿主 Nginx 读不到容器卷内容，所以部署脚本会把容器内文件同步到
    # /opt/mua/site/img/uploads（宿主路径），这里直接托管宿主那份。
    location ^~ /img/uploads/ {
        # 大视频支持 Range 请求 —— 播放器拖进度条依赖 206 Partial Content
        add_header Accept-Ranges bytes;
        # 长缓存：文件名带随机后缀（musbxxxx-8hex.png），内容变了文件名就变
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ------------------------------------------------------------ 静态资源
    # 带 hash 的构建产物可长期缓存
    location ~* \.(?:css|js|mjs|woff2?|ttf|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 品牌资产（logo / 分享图）长期不变
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ------------------------------------------------------------- HTML
    # index.html 绝不能缓存 —— 它是入口，改了内容不改它就拿不到新版本
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /admin/index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ------------------------------------------------------ SPA history 路由
    # 前台是自写 history 路由（要 /album/w1 不要 #/album/w1），
    # 直接访问深链时 Nginx 找不到文件 —— 全部回落到 index.html 交给前端路由。
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 本身不缓存（上面的 = /index.html 只匹配精确路径）
        add_header Cache-Control "no-cache";
    }

    # -------------------------------------------------------------- 健康检查
    # 供 update.sh 的健康检查用：验 Nginx 活着 + 验后端真起来了
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
