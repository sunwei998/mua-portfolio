# ============================================================================
# 予时妍 YUÉ ATELIER · 站点 Nginx 站点配置
#
# ⚠️ **本文件不会被 update.sh 自动部署**（脚本完全不管 nginx）。
#    改完必须手工同步，否则服务器会一直跑着旧的一份（2026-10-04 发现两份已分叉）：
#      sudo cp /opt/mua/deploy/nginx.conf /etc/nginx/sites-available/mua
#      sudo nginx -t && sudo systemctl reload nginx
#    实际生效靠的是 sites-enabled/mua → sites-available/mua 的软链接；
#    conf.d/ 目录在本机是空的，不要照旧注释装到那里去。
#    ⚠️ 语法不过就 reload 会把现有站点全搞挂，顺序永远是 nginx -t 先过。
#
# 端口分配（2026-10-04 用户拍板互换）：
#   **本项目占 80**，sanhe-web 挪到 8083。
#   80 是标准 Web 端口 ⇒ 会收到大量境外扫描器流量（此前 sanhe 日志里全是
#   phpunit / thinkphp 漏洞探测），本项目只有静态站 + 一个 API，暴露面远小于 Spring Boot。
#   备案落地后加 443 ssl server 块，业务配置原样复用。
#
# 与 sanhe 的隔离（同机共存）：
#   sanhe 的 Nginx **在容器内**（sanhe-web），本文件是**宿主机**的 Nginx，两者互不相干。
# ============================================================================

server {
    # 8083 → 80：与 sanhe-web 互换后的新对外入口（2026-10-04）。
    listen      80;
    listen      [::]:80;
    server_name _;

    # 站点静态根（零构建 ESM 前台）
    root  /opt/mua/site;
    index index.html;

    charset utf-8;
    # 后台上传视频可达 40MB+，转码前的原件更大（曾有 67MB 的 .mov）
    client_max_body_size 200m;

    # 上传大文件时先缓冲到磁盘，避免占满内存（1.7GB 机器的关键）
    client_body_buffer_size 1m;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
    # 视频/图片本身已压缩，再 gzip 纯浪费 CPU
    gzip_vary         on;

    # ---------------------------------------------------------------- API
    # ⚠️ 必须用 `^~`（而不是裸前缀 location）：
    #    Nginx 里「前缀 location」命中后**仍会继续检查正则 location**，
    #    后面那条静态资源正则 `\.js$` 会抢走 /api/xxx.js 这类请求。
    #    `^~` 表示「命中即终止正则匹配」。这是 sanhe 部署手册里记过的坑。
    location ^~ /api/ {
        # 结尾**不带**斜杠：原始路径原样透传给后端
        proxy_pass         http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 后端 trustProxy: true，会读 X-Forwarded-For 拿真实客户端 IP
        proxy_read_timeout 300s;
        # 视频上传 + 服务端转码可能跑几分钟，给足写超时
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # --------------------------------------------------------- 后台（Vue 构建产物）
    # Vite base=/admin/，构建产物在 admin/dist（index.html 里资源前缀是 /admin/xxx）。
    #
    # ⚠️ **alias 必须指到 dist/，不能指到 admin/**（2026-10-04 修）：
    #    写 `alias /opt/mua/admin/` 会命中源码目录里的那个 Vite 开发版 index.html
    #    ——它引用的是 /src/main.ts（浏览器里跑不了 TS），后台必然白屏。
    #    而 S3 EU SaaS 版 index.html 在 dist/index.html。**二者只差一层目录，肉眼极难分辨**。
    #
    # ⚠️ 这里刻意不用 try_files（nginx 已知坑，ticket #97）：
    #    try_files 的最后一个参数若写成 URI（如 /admin/index.html），
    #    会**回落到 root 去解析** ⇒ 实际找的是 /opt/mua/site/admin/index.html ⇒ 404。
    #
    # ⚠️ alias 只能指到**目录**再靠 index 找入口。指到文件会被 nginx 当成目录、
    #    再自动拼一次 index ⇒ "/opt/mua/admin/dist/index.htmlindex.html" ⇒ 500。
    location = /admin/ {
        alias /opt/mua/admin/dist/;
        index index.html;
        # 入口页绝不缓存，否则后台更新了用户还拿旧 shell
        add_header Cache-Control "no-store, must-revalidate";
    }
    location ^~ /admin/ {
        alias /opt/mua/admin/dist/;
        # hash 路由下深链（手输 /admin/xxx）找不到静态文件时回落到入口，
        # 交给前端路由。写成 = /admin/ 做内部重定向，绕开 try_files 的 root 坑。
        error_page 404 = /admin/;
        location ~* \.(?:css|js|mjs|woff2?|ttf|svg|ico)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }
    }
    # hash 路由下 /admin 不带尾斜杠也需要可用
    location = /admin { return 301 /admin/; }

    # ---------------------------------------------------- 上传素材（uploads）
    # 2026-10-03 起 uploads 是 bind mount（宿主 /opt/mua/site/img/uploads ⇄
    # 容器 /site/img/uploads），API 写入与 Nginx 读取是**同一个目录**，无需同步。
    # （旧注释提到的「容器卷 + 部署脚本同步」方案已随 sync-uploads.sh 一并退休）
    location ^~ /img/uploads/ {
        # 大视频支持 Range 请求 —— 播放器拖进度条依赖 206 Partial Content
        add_header Accept-Ranges bytes;
        # 长缓存：文件名带随机后缀（musbxxxx-8hex.png），内容变了文件名就变
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ------------------------------------------------------------ 静态资源
    # 带 hash 的构建产物可长期缓存
    location ~* \.(?:css|js|mjs|woff2?|ttf|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 品牌资产（logo / 分享图）长期不变
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ------------------------------------------------------------- HTML
    # index.html 绝不能缓存 —— 它是入口，改了内容不改它就拿不到新版本
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
    # ⚠️ 这里**不能**再加 `location = /admin/index.html`（2026-10-04 踩）：
    #    `location = /admin/` 里的 index 指令会触发内部重定向到 /admin/index.html，
    #    若存在精确匹配的那条，它会**优先命中且不会继承 alias**，
    #    于是跑去 server 级 root 下找 /opt/mua/site/admin/index.html ⇒ 404。
    #    不写这条，/admin/index.html 自然落到 `location ^~ /admin/` 的 alias ⇒ 正确命中。

    # ------------------------------------------------------ SPA history 路由
    # 前台是自写 history 路由（要 /album/w1 不要 #/album/w1），
    # 直接访问深链时 Nginx 找不到文件 —— 全部回落到 index.html 交给前端路由。
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 本身不缓存（上面的 = /index.html 只匹配精确路径）
        add_header Cache-Control "no-cache";
    }

    # -------------------------------------------------------------- 健康检查
    # 供 update.sh 的健康检查用：验 Nginx 活着 + 验后端真起来了。
    #
    # ⚠️ **必须用 `=` 精确匹配并直接 return，绝不能删**（2026-10-04 实测教训）：
    #    缺了这条，/healthz 会落到下面 `location /` 的 try_files，
    #    回落到 index.html ⇒ 返回 **200 + 1.8KB HTML** 而不是 "ok"。
    #    后果是健康检查**永久假阳性**：只要 nginx 活着 index.html 在就报通过，
    #    哪怕 API 容器已挂、数据库连不上，部署也照样显示「✓ 新版本健康」。
    #    这是最坏的一种失败——损失的不只是检测能力，是对整套部署结论的信任。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
