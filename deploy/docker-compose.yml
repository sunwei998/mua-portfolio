# ============================================================================
# 予时妍 YUÉ ATELIER · 生产编排（API 单容器）
#
# 一键起服务：
#     cd /opt/mua/deploy
#     cp env.example .env && nano .env      # 填密码与密钥
#     docker compose up -d --build
#
# 为什么只有一个容器（与 sanhe 相反）：
#   sanhe 是「MySQL + 后端 + Nginx 前端」三容器自闭环，对外只占 80。
#   本项目**不自带数据库**（复用同机 sanhe-mysql 容器，见下方 networks 段），
#   也**不用容器跑 Nginx** —— 宿主机已装 Nginx（sanhe 迁移下来的习惯），
#   由它托管 site/ 与 admin/dist/ 两个静态根并反代 /api 到本容器。
#   少两个容器 = 少 400MB 常驻内存（这机器只有 1679MB），
#   且静态文件不经容器层，直读磁盘，微信 X5 加载更快。
#
# 与 sanhe 的隔离（**改动时务必保持**）：
#   · 容器名 mua-api，与 sanhe-{mysql,server,web} 无交集
#   · 端口 8083（80 归 sanhe-web，443 备用）
#   · 只**加入** sanhe_default 网络（external: true），不修改该网络任何配置
#   · 卷名 mua_uploads_assets，独立于 sanhe 的卷
# ============================================================================

name: mua

services:
  # ------------------------------------------------------------------- API
  api:
    build:
      # 上下文是仓库根：Dockerfile 里要 COPY server/package.json 与 server/src
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: mua-api:latest
    container_name: mua-api
    restart: unless-stopped
    environment:
      # ⚠️ 三个值缺一不可（与 server/src/index.ts 的默认值不同）：
      #   · DB_HOST=sanhe-mysql   —— 容器名，不是 127.0.0.1
      #   · PORT=8082             —— 容器内端口，Nginx 反代目标
      #   · HOST=0.0.0.0          —— ⚠️ 源码默认是 127.0.0.1！不改则容器内
      #     只能自己连自己，Nginx 反代会 ECONNREFUSED（本机开发默认值不适合容器）
      DB_HOST: ${DB_HOST:-sanhe-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-mua}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-mua_portfolio}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?请在 .env 里设置 ADMIN_JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-mua}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 指到 apt 装的系统 ffmpeg（覆盖 ffmpeg-static 的默认路径，见 Dockerfile.api 注释）
      FFMPEG_BIN: /usr/bin/ffmpeg
      NODE_ENV: production
      PORT: 8082
      HOST: 0.0.0.0
      TZ: Asia/Shanghai
    volumes:
      # 后台上传的图片/视频落盘处。**不能丢** —— 容器删了素材就没了。
      #
      # ⚠️ 挂载点必须与代码里的 UPLOAD_DIR **完全一致**（2026-10-03 首次部署踩过）：
      #   server/src/admin.ts 的 UPLOAD_DIR 是
      #     path.join(dirname(import.meta.url), '..', '..', 'site', 'img', 'uploads')
      #   镜像里源码在 /app/src/admin.ts ⇒ 解析结果是  /app/src/../../site/img/uploads
      #                                              =  /site/img/uploads      ← 不是 /app/...
      #   之前挂的是 mua_uploads_assets:/app/data/uploads（还 ENV 了 MUA_UPLOAD_DIR），
      #   但**代码里零处读这个环境变量** —— 卷空转，素材落进容器可写层，重建即丢；
      #   且因为 /site 压根没挂载，node 用户（uid 1000）在 / 下无权 mkdir，
      #   上传会直接 EACCES 失败。
      #
      # 为什么用 bind mount 而不是命名卷（本次一并纠正的架构决策）：
      #   宿主 Nginx 的静态根是 /opt/mua/site，托管 /img/uploads/。
      #   命名卷方案需要「容器 → 宿主」反向同步（sync-uploads.sh）才能让 Nginx 读到文件，
      #   多一层、多一个会静默失败的环节（同步没跑 ⇒ 图 404，且查不出原因）。
      #   bind mount 让 API 写入与 Nginx 读取**落在同一个宿主目录**，
      #   容器可写、宿主可读、容器重建不丢，同步脚本随之退休。
      - /opt/mua/site/img/uploads:/site/img/uploads
    # 不对宿主机暴露端口：只有宿主 Nginx 能访问它。
    # 这样即使防火墙漏配，API 也不会直接暴露到公网。
    expose:
      - "8082"
    # ⚠️ 这一段是**整个部署能跑起来的关键**，别删（2026-10-03 首次部署踩过）。
    #
    # 坑：只在文件**末尾**的顶层 `networks:` 声明了 sanhe_default，
    #      却没在**服务里** networks: 引用它 ——
    #      compose 看到服务没声明网络，就自动挂到项目默认网络 mua_default，
    #      同时按顶层声明**顺手新建**了一个空的 sanhe_default 副本之外的默认网。
    #      结果：容器状态显示 Up，但 DB_HOST=sanhe-mysql 报 ENOTFOUND
    #      （MySQL 在真 sanhe_default 里，容器却在另一个网），
    #      错误信息完全指向"数据库地址写错"，极具误导性。
    # 正确：顶层声明网络 + 服务里显式引用，两者都要有。
    networks:
      - sanhe_default
    # 2核/1.7GB 机器（与 sanhe-mysql 768m + sanhe-server 1024m 共存）：
    # Node 常驻约 150-200MB，512m 留够转码时的临时峰值。
    # ⚠️ 改大前先 free -m 看可用值：三个容器上限之和必须低于物理内存。
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8082/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      # ⚠️ 键名是 max-file，不是 file（2026-10-03 首次部署踩过）。
      # 写成 file 会报 `unknown log opt 'file' for json-file log driver`，
      # 而这个错误发生在**容器创建阶段** —— 迁移、健康检查、启动全都被它挡住，
      # 日志里只有一行 daemon 报错，完全看不出是日志配置写错。
      # 这个选项直接决定容器能不能被创建，别改错。
      options: { max-size: "10m", max-file: "3" }

networks:
  # 加入 sanhe 的网络以容器名访问它的 MySQL。
  # ⚠️ external: true = 「这个网络已存在，直接用，别动它」。
  # 若漏了这个声明，compose 会新建一个同名网络，MySQL 就在别的网里了，
  # 表现为 DB_HOST=sanhe-mysql 报 ENOTFOUND，而容器状态却显示 Up（极具误导性）。
  sanhe_default:
    external: true
